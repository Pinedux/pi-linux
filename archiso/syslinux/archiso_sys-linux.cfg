LABEL arch
TEXT HELP
Boot the Pi-Linux live medium on BIOS.
It allows you to install Pi-Linux or perform system maintenance.
ENDTEXT
MENU LABEL Pi-Linux live medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% usbcore.autosuspend=-1

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Pi-Linux live medium on BIOS with speakup screen reader.
It allows you to install Pi-Linux or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Pi-Linux live medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% usbcore.autosuspend=-1 accessibility=on

# Safe mode with nomodeset for problematic GPUs
LABEL archsafe
TEXT HELP
Boot with basic graphics drivers (nomodeset) for problematic GPUs.
All modules loaded, copy to RAM disabled.
ENDTEXT
MENU LABEL Pi-Linux Safe Mode (%ARCH%, BIOS, safe graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% usbcore.autosuspend=-1 nomodeset
