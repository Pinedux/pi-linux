#!/bin/bash
# Pi-Linux - Configuración de Instalación Desatendida v2.0
# Modifica estos valores según tus preferencias

# ============================================
# SISTEMA BASE
# ============================================

# Entorno de escritorio: plasma | gnome | hyprland
DESKTOP_ENV="plasma"

# Driver GPU: auto | nvidia | nvidia-open | amd | intel | vm | generic
GPU_TYPE="auto"

# Información del usuario
USERNAME="pi"
HOSTNAME="pi-linux"
TIMEZONE="Europe/Madrid"
LOCALE="es_ES.UTF-8"
KEYMAP="es"

# ============================================
# RICES / TEMAS COMPLETOS
# ============================================

# Rice para Hyprland: hyde | ml4w | end4 | none
HYPR_RICE="hyde"

# Rice para GNOME: whitesur | orchis | graphite | catppuccin | nordic | none
GNOME_RICE="whitesur"

# Rice para Plasma: whitesur | mactahoe | sweet | layan | catppuccin | orchis | none
PLASMA_RICE="sweet"

# Tema SDDM: astronaut | elegant | match-de | none
SDDM_THEME="astronaut"

# Instalar extensions esenciales GNOME (y/n)
INSTALL_GNOME_EXTENSIONS="y"

# Variable legacy (se mapea automáticamente al rice del DE)
THEME="sweet"

# ============================================
# SOFTWARE (y = instalar, n = omitir)
# ============================================

# Navegadores
INSTALL_CHROME="y"
INSTALL_BRAVE="n"
INSTALL_FIREFOX="y"

# Productividad
INSTALL_VSCODE="y"
INSTALL_OBSIDIAN="n"

# Multimedia
INSTALL_VLC="y"
INSTALL_SPOTIFY="y"
INSTALL_OBS="n"

# Terminales
INSTALL_KITTY="y"
INSTALL_ALACRITTY="n"

# Desarrollo
INSTALL_DOCKER="y"
INSTALL_NODEJS="y"
INSTALL_PYTHON="y"

# Herramientas CLI modernas
INSTALL_FZF="y"
INSTALL_RIPGREP="y"
INSTALL_FD="y"
INSTALL_BAT="y"
INSTALL_EZA="y"
INSTALL_ZOXIDE="y"
INSTALL_ATUIN="n"
INSTALL_DELTA="n"

# Editores
INSTALL_NEOVIM="y"
INSTALL_LAZYVIM="n"
INSTALL_DOOMEMACS="n"

# Monitores
INSTALL_BTOP="y"
INSTALL_NVTOP="y"

# Shells
INSTALL_ZSH="y"
INSTALL_OHMYZSH="y"
INSTALL_FISH="n"
INSTALL_STARSHIP="y"

# Tmux
INSTALL_TMUX="y"
INSTALL_OHMYTMUX="n"
