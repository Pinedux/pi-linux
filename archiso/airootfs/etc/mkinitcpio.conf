# vim:set ft=sh:
# Pi-Linux: Custom mkinitcpio.conf for live environment
# Forces USB modules for problematic hardware (e.g. Chuwi CoreBook X)

MODULES=(xhci_hcd xhci_pci ehci_hcd ohci_hcd usb_storage uas usbhid)
BINARIES=()
FILES=()
HOOKS=(base systemd autodetect microcode modconf kms keyboard keymap sd-vconsole block filesystems fsck)

COMPRESSION="zstd"
