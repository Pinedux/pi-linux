# Pi-Linux archiso live initramfs configuration
# Includes USB modules for maximum hardware compatibility (BIOS legacy + UEFI)
# squashfs/loop/overlay are REQUIRED for copytoram (Safe Mode) to work

MODULES=(squashfs loop overlay cdrom isofs nvme vmd thunderbolt xhci_hcd xhci_pci ehci_hcd ohci_hcd usb_storage uas usbhid ahci sd_mod sr_mod)
HOOKS=(base udev microcode modconf kms archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
