# Pi-Linux archiso live initramfs configuration
# Uses direct mount from USB (no copytoram) for faster boot.
# archiso_loop_mnt removed from default hooks to avoid copying rootfs to RAM.

MODULES=(squashfs loop overlay cdrom isofs nvme vmd thunderbolt xhci_hcd xhci_pci ehci_hcd ohci_hcd usb_storage uas usbhid ahci sd_mod sr_mod)
HOOKS=(base udev microcode modconf kms archiso block filesystems keyboard)
COMPRESSION="zstd"
